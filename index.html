<style>
:root { color-scheme: light dark; }
body {
  font-family: sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 0.5rem;
}
@media (prefers-color-scheme: light) {
  body {
    background-color: #ffffff;
    color: #000000;
  }
  .green { background-color: #d0f0c0; }
  .yellow { background-color: #fff9c0; }
  .red { background-color: #f0c0c0; }
}
@media (prefers-color-scheme: dark) {
  body {
    background-color: #121212;
    color: #ffffff;
  }
  .green { background-color: #145214; color: #ffffff; }
  .yellow { background-color: #b58f00; color: #000000; }
  .red { background-color: #7f0000; color: #ffffff; }
}
h1 { color: #2e7d32; }
footer { font-size: 0.8rem; margin-top: 2rem; }
select, label { margin: 0.5rem; }
.filters {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  max-width: 900px;
}
.lists {
  display: flex;
  flex-direction: column;
  max-width: 900px;
  width: 100%;
}
ul {
  list-style: none;
  padding: 1rem;
  border-radius: 6px;
}
</style>

const monthSelect = document.getElementById("month");
for(let m in monthMap){
  const option = document.createElement("option");
  option.value = m;
  option.textContent = monthMap[m];
  monthSelect.appendChild(option);
}

const today = new Date();
const currentMonth = today.toLocaleString("de-DE",{month:"short"});
monthSelect.value = currentMonth.charAt(0).toUpperCase() + currentMonth.slice(1,3);

function updateList(){
  const selectedMonth = monthSelect.value;
  const categorySelect = document.getElementById("category");
  const selectedCategory = categorySelect.value;

  const green = document.querySelector(".green");
  const yellow = document.querySelector(".yellow");
  const red = document.querySelector(".red");
  green.innerHTML=""; yellow.innerHTML=""; red.innerHTML="";

  foods.forEach(f=>{
    if(selectedCategory !== "all" && f.category !== selectedCategory) return;

    const months = f.months[selectedMonth];
    if(!months) return;

    const greenMethods = months.filter(m=>"F"===m).map(m=>methodMap[m]);
    const yellowMethods = months.filter(m=>["G","K","L"].includes(m)).map(m=>methodMap[m]);
    const redMethods = months.filter(m=>"S"===m).map(m=>methodMap[m]);

    if(greenMethods.length>0) green.innerHTML += `<li>${f.name} (${greenMethods.join(", ")})</li>`;
    if(yellowMethods.length>0) yellow.innerHTML += `<li>${f.name} (${yellowMethods.join(", ")})</li>`;
    if(redMethods.length>0) red.innerHTML += `<li>${f.name} (${redMethods.join(", ")})</li>`;
  });

  green.style.display = green.children.length ? "block":"none";
  yellow.style.display = yellow.children.length ? "block":"none";
  red.style.display = red.children.length ? "block":"none";
}

monthSelect.addEventListener("change", updateList);
document.getElementById("category").addEventListener("change", updateList);

updateList();
